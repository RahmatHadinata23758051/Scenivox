<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Scenivox: from brief to editable scenes</title>
<desc id="desc">A project brief branches to ordered scene cards, immutable revision snapshots, and a future render pipeline, with the current Rust and SQLite persistence boundary highlighted.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182430"/><stop offset="1" stop-color="#10171d"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ee0b0"/><stop offset="1" stop-color="#77d7d4"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#7790a0"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#e8eef2}.muted{fill:#91a1ae}.small{font-size:14px}.label{font-size:13px;letter-spacing:1.8px;font-weight:700}.title{font-size:25px;font-weight:650}.outline{fill:#151f28;stroke:#33434f;stroke-width:1.5}.line{stroke:#7790a0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#526875;stroke-width:1.5}</style>
</defs>
<rect width="1120" height="650" rx="18" fill="#0e141a"/><rect width="1120" height="650" rx="18" fill="url(#grid)"/>
<text x="48" y="58" class="label" fill="#5ee0b0">SCENIVOX / LOCAL-FIRST PRODUCTION WORKSPACE</text>
<text x="48" y="101" font-size="34" font-weight="700">Keep the story editable. Keep the history honest.</text>
<text x="48" y="132" font-size="16" class="muted">Persistence works today. AI planning, approval and rendering remain separate future gates.</text>
<!-- brief -->
<rect x="52" y="205" width="215" height="236" rx="14" fill="url(#panel)" stroke="#3b4b57"/>
<text x="76" y="244" class="label" fill="#ffcc70">01 / PROJECT BRIEF</text>
<text x="76" y="282" class="title">One local</text><text x="76" y="313" class="title">workspace</text>
<text x="76" y="353" class="small muted">Title · idea · target</text><text x="76" y="378" class="small muted">Model preference map</text>
<path d="M76 409h155" stroke="#43545f" stroke-width="1"/>
<text x="76" y="429" font-size="12" fill="#ffcc70">SQLite / SQLx</text>
<!-- connection -->
<path d="M267 323H340" class="line"/>
<!-- revision frame -->
<rect x="356" y="186" width="450" height="286" rx="16" fill="#121a21" stroke="#5ee0b0" stroke-width="2"/>
<rect x="356" y="186" width="450" height="47" rx="16" fill="#17242b"/><path d="M356 233h450" class="thin"/>
<text x="380" y="216" class="label" fill="#5ee0b0">02 / IMMUTABLE REVISION SNAPSHOT · IMPLEMENTED</text>
<!-- scene tiles -->
<g>
 <rect x="382" y="258" width="124" height="120" rx="10" class="outline"/><rect x="394" y="270" width="100" height="47" rx="6" fill="#263b43"/><path d="M410 308l17-25 15 20 13-12 23 26h-68z" fill="#5ee0b0" opacity=".75"/><text x="394" y="344" font-size="13" font-weight="650">Scene 01</text><text x="394" y="365" font-size="11" class="muted">Hook · 8,000 ms</text>
 <rect x="520" y="258" width="124" height="120" rx="10" class="outline"/><rect x="532" y="270" width="100" height="47" rx="6" fill="#332f3d"/><circle cx="565" cy="291" r="10" fill="#ffcc70"/><path d="M535 313l24-11 18 9 19-15 35 21h-96z" fill="#aa8e8a"/><text x="532" y="344" font-size="13" font-weight="650">Scene 02</text><text x="532" y="365" font-size="11" class="muted">Narration · 12,000 ms</text>
 <rect x="658" y="258" width="124" height="120" rx="10" class="outline"/><rect x="670" y="270" width="100" height="47" rx="6" fill="#23383d"/><path d="M679 307q14-26 28 0t28 0t28 0" fill="none" stroke="#77d7d4" stroke-width="3"/><text x="670" y="344" font-size="13" font-weight="650">Scene 03</text><text x="670" y="365" font-size="11" class="muted">Action · 10,000 ms</text>
</g>
<text x="382" y="420" font-size="13" class="muted">ordered scenes · exact duration sum · stable IDs · canonical SHA-256</text>
<path d="M583 472v40" class="line"/>
<rect x="384" y="522" width="402" height="78" rx="12" fill="#19242c" stroke="#43545f"/>
<text x="407" y="553" class="label" fill="#77d7d4">03 / SQLITE HISTORY</text><text x="407" y="580" font-size="14" class="muted">Project pointer advances; prior revision bytes stay immutable.</text>
<!-- future branch -->
<path d="M806 330h74" class="line"/>
<rect x="896" y="205" width="180" height="236" rx="14" fill="#151920" stroke="#665a48" stroke-dasharray="7 6"/>
<text x="918" y="245" class="label" fill="#ffcc70">FUTURE GATES</text>
<text x="918" y="284" font-size="19" font-weight="650">Model adapter</text><text x="918" y="308" class="small muted">not implemented</text>
<path d="M918 330h136" stroke="#39444c"/>
<text x="918" y="359" font-size="19" font-weight="650">Approval</text><text x="918" y="382" class="small muted">not implemented</text>
<path d="M918 402h136" stroke="#39444c"/>
<text x="918" y="430" font-size="19" font-weight="650">MP4 pipeline</text>
<text x="48" y="625" class="small muted">No provider calls · no approval workflow · no renderer · no playable export claim</text>
</svg>
