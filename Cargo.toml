 [lib]
 name = "scenivox"
 path = "src/lib.rs"

[package]
name = "scenivox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "=0.8.9"
clap = { version = "=4.5.53", features = ["derive"] }
dotenvy = "=0.15.7"
serde = { version = "=1.0.228", features = ["derive"] }
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
